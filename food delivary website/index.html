<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteMart</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <nav id="navbar">
        <ul>
            <li><a href="">logo</a></li>
            <li><a href="">Home</a></li>
            <li><a href="">Menu</a></li>
            <li><a href="">Order</a></li>
            <li><a href="">Contact</a></li>
            <li><a href="">Login</a></li>
        </ul>

    </nav>

    <section id="body">
        <h1>Welcome to TasteMart</h1>
        <p>~Delicious Food Delivered Fast~</p>
        <button>Order Now</button>
    </section>
    <section id="categories">
        <div class="card A">
            <h2>Non-Veg(hindi)</h2>
            <img src="nonveg.jpg" alt="Non-Veg food items">
            <p></p>
        </div>
        <div class="card B">
            <h2>Veg(hindi)</h2>
            <img src="veg.jpg" alt="Veg food items">
            <p></p>
        </div>
        <div class="card C">
            <h2>CHinese</h2>
            <img src="fast-food.webp" alt="Chinese food items">
            <p></p>
        </div>
        <div class="card D">
            <h2>Deserts</h2>
            <img src="desert.webp" alt="Desert items">
            <p></p>
        </div>
        <div class="card E">
            <h2>Beverages</h2>
            <img src="beverages.jpg" alt="Beverage items">
            <p></p>
        </div>
    </section>

</body>
</html>
