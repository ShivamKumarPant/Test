<!DOCTYPE html>
<html>
    <head>
        <title>Profile(Learning)</title>
        <link rel="stylesheet" href="revstyle.css">
    </head>
    <body>
        <header class="header">
            <img src="htmlpic.jpg" alt="profile picture" height="250px" width="200px" class="pimage">
            <h1>Shivam Kumar Pant</h1>
        </header>

        <section class="about">
            <p>I am a 2nd year btech student currently persuing my degree from GBPIET Ghurdauri.</p>
            <h2>Skills</h2>
            <ul>
                <li class="li1">python</li>
                <li class="li2">c</li>

        </section>

        <footer>
             <h3>insta_id</h3>
            <a href="https//:www.instagram.com">https//:www.instagram.com</a>

        </footer>
        
        <section>
            <h2>Form</h2>
            <form>
                <label for="name">Name </label>
                <input type="text" id="name" name="name" placeholder="enter name" required>
                <br><br>
                <label for="email">email</label>
                <input type="email" id="email" name="email" placeholder="enter email">
                <br><br>
                <label for="message">message</label>
                <textarea id="message" name="message" rows="4" column="30"></textarea>
                <br><br>
                <label for="checkbox">i am 18+</label>
                <input type="checkbox" id="checkbox" name="checkbox" value="yes">
                <br><br>
                <label for="10">class 10</label>
                <input type="radio" id="10" name="class" value="10">
                <label for="11">class 11</label>
                <input type="radio" id="11" name="class" value="11">
                <label for="12">class 12</label>
                <input type="radio" id="12" name="class" value="12">
                <br><br>
                <button type="submit">submit</button>

            </form>

            <br><br>
            <label for="profession">select one</label>
            <select name="profession" id="profession">
                <option value="student">student</option>
                <option value="parent">parent</option>
                <option value="teacher">teacher</option>
            </select>

            

        </section>

                        name

                </tr>

        </section>

       
    </body>
</html>
